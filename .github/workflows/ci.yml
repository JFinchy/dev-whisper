name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Must match src-tauri/rust-toolchain.toml, so the cache key below
      # (computed from the active rustc) agrees with what cargo builds with.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-${{ hashFiles('src-tauri/rust-toolchain.toml') }}
      - uses: oven-sh/setup-bun@v2
      # tauri::generate_context! embeds the frontend build, so clippy and the
      # tests need dist/ to exist.
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ./scripts/check-versions.sh
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --lib
        working-directory: src-tauri

  audio-e2e:
    name: Dictation e2e (real audio → Whisper → pipeline)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-${{ hashFiles('src-tauri/rust-toolchain.toml') }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/cache@v4
        with:
          path: src-tauri/models
          key: whisper-base-en-q5_1-4baf70dd
      - run: ./scripts/download-model.sh
      - run: bun run test:audio

  ui-e2e:
    name: UI e2e (Playwright, WebKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx playwright install webkit
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
